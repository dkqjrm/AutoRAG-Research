# MrTyDi Korean + base bge-m3
# Full retrieval benchmark with all pipeline methods

db_name: mrtydi_korean_full

max_retries: 3
eval_batch_size: 100

pipelines:
  retrieval:
    - vector_search
    - bm25
    - hybrid_rrf
    - hybrid_cc
    - hyde_gemini
    - rag_fusion_gemini
    - grep_rag_gemini
    - query_decomposition_gemini
    - step_back_gemini

metrics:
  retrieval:
    - recall
    - ndcg
    - mrr
    - map
