# Experiment configuration
#
# This file defines an experiment with pipelines and metrics.
# Edit this file to configure your RAG experiment.
#
# Usage:
#   autorag-research run                           # Run this config
#   autorag-research run --db-name=my_db          # Override db_name
#   autorag-research run --max-retries=5          # Override max_retries
#

# Target database name (created by ingest command)
# Recommend to override via CLI argument --db-name
db_name: mrtydi_korean_full

# Executor settings
max_retries: 3
eval_batch_size: 100

# Pipeline configurations
# YAML key = folder path under configs/pipelines/
pipelines:
  retrieval:
    - vector_search           # Pure dense vector retrieval (bge-m3)
    - bm25_korean             # BM25 sparse retrieval (Korean tokenizer)
    - hybrid_rrf_korean       # Hybrid BM25 + Vector with RRF fusion
    - hybrid_cc_korean        # Hybrid BM25 + Vector with convex combination
    - hyde_gemini             # HyDE: hypothetical document embeddings
    - rag_fusion_gemini       # RAG-Fusion: multi-query variations + RRF
    - grep_rag_gemini         # GrepRAG: LLM keyword extraction + ripgrep
    - query_decomposition_gemini  # Query decomposition into sub-queries + RRF
    - step_back_gemini        # Step-back prompting: abstract query + RRF

# Metric configurations
# YAML key = folder path under configs/metrics/
metrics:
  retrieval:
    - recall            # Fraction of relevant items retrieved
    - ndcg              # Normalized Discounted Cumulative Gain
    - mrr               # Mean Reciprocal Rank
    - map               # Mean Average Precision
  generation:
    - rouge             # N-gram overlap with ground truth
