# Oliveyoung fine-tuned BGE-M3 Embeddings (sentence-transformers)
# Model: dkqjrm/augmented-olive-product-phonetic-sentence-wo-negative-v2-bge-m3
# WARNING: MPS (Apple Silicon) corrupts bge-m3 embeddings.
# This fine-tuned model uses MEAN pooling without a Normalize module,
# so normalize_embeddings must be set explicitly.
# Use EMBEDDING_DEVICE=cuda on GPU servers, defaults to cpu (safe fallback).
_target_: langchain_huggingface.HuggingFaceEmbeddings
model_name: dkqjrm/augmented-olive-product-phonetic-sentence-wo-negative-v2-bge-m3
model_kwargs:
  device: ${oc.env:EMBEDDING_DEVICE,cpu}
encode_kwargs:
  normalize_embeddings: true
